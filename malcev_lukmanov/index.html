<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ 21: Селекторы</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <main class="container">
        <div class="card card--featured">
            <h2>Заголовок карточки Featured</h2>
            <p>Esto обычный текст карточки, который должен быть темным.</p>
            <p class="hint">Это подсказка (hint), она должна исключаться из общего правила.</p>
            <a href="#">Наведи на меня (тест :has)</a>
        </div>

        <div class="card card--important">
            <h2>Заголовок карточки Important</h2>
            <p>Еще один параграф для проверки селекторов.</p>
            <p class="hint">Вторая подсказка, которая не изменит цвет.</p>
        </div>

        <form class="filter-form">
            <div class="form-group">
                <label for="email">Email (Обязательное поле):</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name">
            </div>
        </form>
    </main>

</body>
</html>
